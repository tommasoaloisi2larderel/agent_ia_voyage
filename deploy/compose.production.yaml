services:
  app:
    image: fram-voyage:${FRAM_RELEASE:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fram-voyage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: /opt/fram/shared/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    volumes:
      - /opt/fram/shared/cache:/app/.cache
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 96
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/bootstrap').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
